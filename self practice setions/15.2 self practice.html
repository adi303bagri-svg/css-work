<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: beige;
      }
      .parent {
        background-color: white;
        border: 2px solid white;
        width: 285px;
        margin: 0px auto;
        border-radius: 20px;
        padding: 6px;
        
        box-shadow: 0 10px 30px rgba(0,0,0,.08);

      }
      h1{
        text-align: center;
      }
      .image img{
        width: 100%;
        margin-bottom: 20px;
       border-radius: 20px; 
    }
      .nature{
        margin: 15px;
        padding: 8px;
        background-color: rgb(192, 248, 248);
        border-radius: 20px;
      }
      .lake{
        margin: 15px;
        padding: 8px;
        background-color: rgb(192, 248, 248);
        border-radius: 20px;
      }
      .button{
        display: block;
        margin: auto;
        padding: 10px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 999px;
        background-color: rgb(223, 252, 252);
        border-color: rgb(248, 199, 199);
      }

    </style>
  </head>
  <body>
    <div class="parent">
      <div class="image">
        <img src="exercise.jpg" alt="lake picture" />
      </div>
      <span class="nature">Nature</span>
      <span class="lake">Lake</span>
      <h1>Welcome to the insland</h1>
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Harum
        voluptate sapiente, totam quibusdam nelectus assumenda odit libero
        necessitatibus?
      </p>
      <div>
        <button class="button">Read me</button>
    </div>
    </div>
  </body>
</html>
