<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css shadow and outlines</title>
    <style>
      .box {
        margin: 20px;
        padding: 20px;
        
      }
      .box1 {
        background-color: white;
        border: 2px solid rgb(241, 93, 25);
        box-shadow: 5px 5px 15px 5px #680e08;
        width: 200px;
        height: 100px;
      }
      .box2 {
        background-color: white;
        border-radius: 15px;
        border: 2px solid blue;
        color: purple;
        text-shadow: 2px 2px 4px #3de98a;
        outline:2px solid blue;
        outline-offset:2px;
        
        
        
       }
     .container{
      border: 2px solid blue;
      background-color:yellow;
      border-radius: 8px;

     }
     .container{
      outline: 2px solid black;
      outline-offset: 2px;
     }
    </style>
  </head>
  <body>
    <div class="box box1"></div>
    <div class="box box2">
      sanso me tere nazdeekyo ka ittra tu khol de de khol de me hi kyu ishq
      zahir karu tu bhi bol de
    </div>
    <div class="container">
     I am fine thank you, how are you, I am fine also 
    </div>
  </body>
</html>
