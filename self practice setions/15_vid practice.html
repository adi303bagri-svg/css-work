<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f2f2f2;
      }

      .box {
        width: 320px;
        max-width: 90%;

        margin: 30px auto;
        padding: 12px;

        background: white;

        border: 1px solid #ddd;
        border-radius: 15px;
      }

      .image {
        text-align: center;
      }

      .image img {
        width: 100%;
        border-radius: 15px;
      }

      .tag {
        display: inline-block;

        padding: 6px 14px;

        margin-top: 10px;

        border-radius: 20px;

        background: aqua;
      }

      h1 {
        margin: 15px 0;
      }

      .read-more {
        display: block;

        width: fit-content;

        margin: 20px auto;

        padding: 10px 18px;

        border-radius: 20px;

        background: aqua;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="image">
        <img src="exercise.jpg" />
      </div>

      <span class="tag">Nature</span>
      <span class="tag">Lake</span>

      <h1>Welcome to my island!!</h1>

      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti
        veritatis perspiciatis nisi vero.
      </p>

      <div class="read-more">Read more</div>
    </div>
  </body>
</html>
