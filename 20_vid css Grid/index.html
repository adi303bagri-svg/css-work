<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
        border: 2px solid yellow;
        display: grid;
        grid-template-columns: [pehla] 120px [doosra] 100px [teesra];
        grid-template-rows:[A] 120px [B] 120px [C];
        }
        .item{
        border: 2px solid black;
        height: 55px;
        /* width: 55px; */

        
        }
        .item4{
            grid-row:B/C ;
            grid-column:pehla/teesra ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
